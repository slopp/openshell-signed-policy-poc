version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /usr/local
    - /lib
    - /opt/hermes
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  weather_api:
    name: weather-readonly
    endpoints:
      - host: wttr.in
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/curl
      - path: /usr/bin/python3
      - path: /usr/local/bin/hermes
      - path: /opt/hermes/.venv/bin/python
